name: Release

# Publishes a GitHub Release with the portable Linux build whenever main carries a <Version>
# (Directory.Build.props) that has no release yet. To release: bump <Version> in a PR and merge.
# The workflow creates the vX.Y.Z tag itself. The packaged build is smoke-tested first.

on:
  push:
    branches: [main]
    paths:
      - Directory.Build.props
      - .github/workflows/release.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

env:
  GODOT_VERSION: 4.7.2
  DOTNET_NOLOGO: "1"
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"

jobs:
  linux:
    name: Build, test and publish Linux release
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Version
        id: version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(sed -n 's:.*<Version>\(.*\)</Version>.*:\1:p' Directory.Build.props)
          echo "VERSION=$version" >> "$GITHUB_ENV"
          if gh release view "v$version" >/dev/null 2>&1; then
            echo "v$version is already released; nothing to do."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-dotnet@v4
        if: steps.version.outputs.skip != 'true'
        with:
          dotnet-version: 8.0.x

      - name: Cache Godot editor and export templates
        if: steps.version.outputs.skip != 'true'
        id: godot-cache
        uses: actions/cache@v4
        with:
          path: ~/godot-dl
          key: godot-mono-${{ env.GODOT_VERSION }}

      - name: Download Godot .NET ${{ env.GODOT_VERSION }}
        if: steps.version.outputs.skip != 'true' && steps.godot-cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p ~/godot-dl && cd ~/godot-dl
          base=https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable
          curl -fsSL --retry 3 -o editor.zip "$base/Godot_v${GODOT_VERSION}-stable_mono_linux_x86_64.zip"
          curl -fsSL --retry 3 -o templates.tpz "$base/Godot_v${GODOT_VERSION}-stable_mono_export_templates.tpz"
          curl -fsSL --retry 3 -o SHA512-SUMS.txt "$base/SHA512-SUMS.txt"
          grep -E " (Godot_v${GODOT_VERSION}-stable_mono_linux_x86_64.zip|Godot_v${GODOT_VERSION}-stable_mono_export_templates.tpz)$" SHA512-SUMS.txt \
            | sed -e "s/Godot_v${GODOT_VERSION}-stable_mono_linux_x86_64.zip/editor.zip/" -e "s/Godot_v${GODOT_VERSION}-stable_mono_export_templates.tpz/templates.tpz/" \
            | sha512sum -c -

      - name: Install tools
        if: steps.version.outputs.skip != 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends cmake ninja-build g++ libvulkan-dev xvfb libgl1-mesa-dri libglu1-mesa
          cd ~/godot-dl
          unzip -q -o editor.zip -d editor
          echo "GODOT=$(ls ~/godot-dl/editor/*/Godot_v*_mono_linux.x86_64)" >> "$GITHUB_ENV"
          dest=~/.local/share/godot/export_templates/${GODOT_VERSION}.stable.mono
          mkdir -p "$dest"
          unzip -q -o -j templates.tpz 'templates/linux_*x86_64*' 'templates/version.txt' -d "$dest"

      - name: Vulkan layer
        if: steps.version.outputs.skip != 'true'
        run: |
          cmake -S layer -B layer/build -G Ninja -DCMAKE_BUILD_TYPE=Release
          cmake --build layer/build

      - name: Tests
        if: steps.version.outputs.skip != 'true'
        run: |
          dotnet build EdenDeck.sln -c Release
          dotnet test EdenDeck.sln -c Release --no-build

      - name: Export app
        if: steps.version.outputs.skip != 'true'
        working-directory: src/EdenDeck.App
        run: |
          timeout 300 "$GODOT" --headless --import
          mkdir -p ../../build/godot
          timeout 600 "$GODOT" --headless --export-release Linux ../../build/godot/Scanline.x86_64 2>&1 | tee export.log
          test -x ../../build/godot/Scanline.x86_64
          ! grep -E "^ERROR" export.log

      - name: Headless launcher
        if: steps.version.outputs.skip != 'true'
        run: |
          dotnet publish src/EdenDeck.Cli -c Release -r linux-x64 --self-contained \
            -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -p:EnableCompressionInSingleFile=true -p:DebugType=none -o build/cli

      - name: Package
        if: steps.version.outputs.skip != 'true'
        run: tools/release/package-linux.sh "$VERSION" build/godot build/cli/scanline layer/build dist

      - name: Smoke test the packaged build
        if: steps.version.outputs.skip != 'true'
        run: |
          mkdir -p "$RUNNER_TEMP/pkg"
          tar xzf dist/Scanline-$VERSION-linux-x86_64.tar.gz -C "$RUNNER_TEMP/pkg"
          # Install over an old Eden Deck install: it moves to ~/Applications/Scanline and the old
          # path stays as a link, so Steam shortcuts that point at it keep working.
          mkdir -p "$RUNNER_TEMP/insthome/Applications/EdenDeck"
          touch "$RUNNER_TEMP/insthome/Applications/EdenDeck/EdenDeck.x86_64"
          HOME="$RUNNER_TEMP/insthome" SCANLINE_RELEASE_URL="file://$PWD/dist" bash dist/install.sh
          test -x "$RUNNER_TEMP/insthome/Applications/Scanline/Scanline.x86_64"
          test -L "$RUNNER_TEMP/insthome/Applications/EdenDeck"
          test -x "$RUNNER_TEMP/insthome/Applications/EdenDeck/EdenDeck.x86_64"
          "$RUNNER_TEMP/insthome/Applications/EdenDeck/edendeck" help >/dev/null
          tar tzf dist/EdenDeck-linux-x86_64.tar.gz | grep -qx 'EdenDeck/EdenDeck.x86_64'
          tools/smoke/run-ui-smoke.sh "$RUNNER_TEMP/pkg/Scanline/Scanline.x86_64" "$RUNNER_TEMP/shots"
          "$RUNNER_TEMP/pkg/Scanline/scanline" help

      - name: Publish release
        if: steps.version.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # "What's new" from CHANGELOG.md comes first; the app shows the part before the "---".
          awk -v v="$VERSION" '$0 ~ "^## " {p = ($2 == v || $2 == "v" v)} p && $0 !~ "^## "' CHANGELOG.md | sed '/./,$!d' > changes.md
          if [ ! -s changes.md ]; then echo "CHANGELOG.md has no section for $VERSION"; exit 1; fi
          { echo "## What's new"; cat changes.md; echo; echo "---"; echo; } > head.md
          cat > notes.md <<NOTES
          Portable Linux build for SteamOS, Bazzite and other x86_64 distros.

          **Install or update** (Desktop Mode, in a terminal, no root needed):

          \`\`\`sh
          curl -fsSL https://github.com/TheRoben-Dev/Scanline/releases/latest/download/install.sh | bash
          \`\`\`

          This installs to \`~/Applications/Scanline\`, adds Scanline to your app menu and puts \`scanline\` on your PATH. Coming from Eden Deck? Your settings, key sets, installed Eden and Steam shortcuts carry over.

          **Start it from Steam for controller support:** *Games → Add a Non-Steam Game to My Library →* tick Scanline. Started outside Steam, Steam's desktop layout turns the controller into keyboard and mouse input (arrows, Enter, Esc and Tab still work).

          **Manual install:** download \`Scanline-linux-x86_64.tar.gz\`, extract it anywhere and run \`Scanline/Scanline.x86_64\`.

          **First run:** on the Eden tab, install Eden (Stable is recommended), then import your own \`prod.keys\` and firmware. Add your game folder on the Library tab.

          Scanline never downloads keys, firmware or games. Downloads are listed in \`SHA256SUMS\`, and the installer checks them.
          NOTES
          cat head.md notes.md > release-notes.md
          gh release create "v$VERSION" dist/* --target "$GITHUB_SHA" --title "Scanline $VERSION" --notes-file release-notes.md

      - name: Upload screenshots
        if: always() && steps.version.outputs.skip != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: release-screenshots
          path: ${{ runner.temp }}/shots
          if-no-files-found: ignore
