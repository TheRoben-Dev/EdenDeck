name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  layer:
    name: Vulkan layer (build, unit tests, lavapipe smoke test)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            cmake ninja-build g++ libvulkan-dev vulkan-tools mesa-vulkan-drivers \
            vulkan-validationlayers xvfb

      - name: Configure and build
        run: |
          cmake -S layer -B layer/build -G Ninja -DCMAKE_BUILD_TYPE=Release
          cmake --build layer/build

      - name: Unit tests
        run: ctest --test-dir layer/build --output-on-failure

      - name: Exported symbols
        run: |
          nm -D --defined-only layer/build/libVkLayer_EDENDECK_fsr.so | awk '{print $3}' | grep -v '^_' | sort > syms.txt
          cat syms.txt
          diff <(printf '%s\n' edendeck_GetDeviceProcAddr edendeck_GetInstanceProcAddr vkNegotiateLoaderLayerInterfaceVersion) syms.txt

      - name: Smoke test with vkcube on lavapipe (explicit layer + validation)
        env:
          VK_ICD_FILENAMES: /usr/share/vulkan/icd.d/lvp_icd.json
          VK_ADD_LAYER_PATH: ${{ github.workspace }}/layer/build
          VK_INSTANCE_LAYERS: VK_LAYER_EDENDECK_fsr:VK_LAYER_KHRONOS_validation
          EDENDECK_LAYER_STATS: ${{ runner.temp }}/stats.json
        run: |
          timeout 120 xvfb-run -a vkcube --c 120 2>&1 | tee vkcube.log
          grep -q 'vkCreateSwapchainKHR ok' vkcube.log
          grep -q 'present: .*total=120' vkcube.log
          if grep -E 'VUID|Validation Error' vkcube.log; then echo "validation errors"; exit 1; fi
          python3 -c "import json,sys; d=json.load(open(sys.argv[1])); assert d['total_presents']==120, d" "$EDENDECK_LAYER_STATS"

      - name: Kill switch keeps the layer passive
        env:
          VK_ICD_FILENAMES: /usr/share/vulkan/icd.d/lvp_icd.json
          VK_ADD_LAYER_PATH: ${{ github.workspace }}/layer/build
          VK_INSTANCE_LAYERS: VK_LAYER_EDENDECK_fsr
          DISABLE_EDENDECK_LAYER: "1"
        run: |
          timeout 60 xvfb-run -a vkcube --c 30 2>&1 | tee off.log
          ! grep -q 'vkCreateSwapchainKHR ok' off.log

  eden-schema:
    name: Eden settings schema snapshots
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Regenerate Stable snapshot and compare
        run: |
          git clone -q --depth 1 --branch v0.2.1 --filter=blob:none https://github.com/eden-emulator/mirror.git /tmp/eden-stable
          python3 tools/extract_eden_settings.py /tmp/eden-stable v0.2.1 /tmp/stable.json
          diff <(python3 -c "import json;d=json.load(open('eden_adapter/schema/eden-stable-v0.2.1.json'));d.pop('eden_commit');print(json.dumps(d,indent=1))") \
               <(python3 -c "import json;d=json.load(open('/tmp/stable.json'));d.pop('eden_commit');print(json.dumps(d,indent=1))")
      - name: Report Nightly drift (informational)
        run: |
          git clone -q --depth 1 --filter=blob:none https://github.com/eden-emulator/mirror.git /tmp/eden-nightly
          python3 tools/extract_eden_settings.py /tmp/eden-nightly nightly /tmp/nightly.json
          latest=$(ls eden_adapter/schema/eden-nightly-*.json | sort | tail -1)
          python3 - "$latest" /tmp/nightly.json <<'EOF' >> "$GITHUB_STEP_SUMMARY"
          import json, sys
          a, b = (json.load(open(p)) for p in sys.argv[1:3])
          ka = {(s["section"], s["key"]) for s in a["settings"]}
          kb = {(s["section"], s["key"]) for s in b["settings"]}
          print(f"### Eden Nightly drift vs {a['eden_label']}\n")
          print(f"Nightly HEAD: `{b['eden_commit']}`\n")
          for k in sorted(kb - ka): print(f"- added `{k[0]}/{k[1]}`")
          for k in sorted(ka - kb): print(f"- removed `{k[0]}/{k[1]}`")
          for e in sorted(set(a["enums"]) | set(b["enums"])):
              if a["enums"].get(e) != b["enums"].get(e): print(f"- enum `{e}` changed")
          if kb == ka and a["enums"] == b["enums"]: print("No drift.")
          EOF
